[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "zc-mailhub"
version = "0.1.22"
description = "A local personal-operations hub for AI assistants"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "mcp==1.30.0",
]

[project.optional-dependencies]
dev = [
    "pytest==9.0.3",
    "pytest-asyncio==1.3.0",
    "ruff==0.12.12",
    "bandit==1.9.4",
    "fastapi==0.141.1",
    "uvicorn[standard]==0.53.0",
    "pydantic==2.13.5",
    "pydantic-settings==2.15.0",
    "python-dotenv==1.2.3",
]



[project.scripts]
mailhub = "mailhub.cli:main"
mail = "mailhub.mail_cli:main"

[tool.hatch.build.targets.wheel]
packages = ["mailhub"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
