name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install uv
        run: pip install uv
      - name: Create venv and install linting tools
        run: |
          uv venv
          uv pip install --system ruff bandit safety
      - name: Sync deps
        run: uv sync --extra dev
      - name: Run ruff lint
        run: uv run ruff check mailhub tests
      - name: Run ruff format check
        run: uv run ruff format --check mailhub tests
      - name: Run security scan (bandit)
        run: |
          uv run bandit -r mailhub -f json -o bandit.json || true
          cat bandit.json | jq '.results[] | select(.issue_severity == "HIGH" or .issue_severity == "MEDIUM")' || echo "No high/medium issues"
      - name: Run dependency audit (safety)
        run: |
          uv run safety check --json > safety.json || true
          cat safety.json | jq '.vulnerabilities[]' 2>/dev/null || echo "No vulnerabilities"
      - name: Run tests
        run: uv run pytest -q
      - name: Upload bandit results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bandit-report
          path: bandit.json
      - name: Upload safety results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: safety-report
          path: safety.json

  docker-test:
    needs: lint-and-test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v5
        with:
          context: .
          load: true
          tags: zc-mailhub:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Run Docker tests
        run: |
          chmod +x scripts/test-docker.sh
          ./scripts/test-docker.sh

  docker-publish:
    needs: docker-test
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/ZeroClue/zc-mailhub
          tags: |
            type=ref,event=tag
            type=raw,value=latest,enable={{is_default_branch}}
      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  publish:
    needs: [lint-and-test, docker-test]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install uv
        run: pip install uv
      - name: Sync deps
        run: uv sync --extra dev
      - name: Run tests
        run: uv run pytest -q
      - name: Build sdist + wheel
        run: uv build
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
